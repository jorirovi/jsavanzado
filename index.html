<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="./css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <title>eHostingCO</title>    
</head>
<body>
    <div class="my-container">
        <div class="cabecera">
            <h1 id="icono" class="logo"></h1>
            <div class="navegador">
                <ul class="mimenu"></ul>
            </div>
        </div>
        <div class="main">
            <div class="section1">
                <video autoplay muted loop class="bg-video">
                    <source src="./assets/video/principal-hd_1280_720.mp4" type="video/mp4">
                </video>
                <p id="texto" class="vtext"></p>
            </div>
            <div class="section2">
                <div class="artder">
                    <h2 class="subtitle">Misión</h2>
                    <p id="p1" class="parrafo"></p>
                </div>
                <div class="artmed">
                    <video autoplay muted loop class="vidqs">
                        <source src="./assets/video/quienessomos.mp4" type="video/mp4">
                    </video>
                </div>
                <div class="artizq">
                    <h2 class="subtitle">Visión</h2>
                    <p id="p2" class="parrafo"></p>
                </div>
            </div>
            <div class="section3">
                <div class="contenedortitulo">
                    <h2 class="titulos3">Noticias</h2>
                </div>
                <div class="contenedornoti">
                    <!--<div class="noti-grid" id="notigrid"></div>-->
                    <div id="carouselExampleCaptions" class="carousel slide">
                        <div id="indicador" class="carousel-indicators"></div>
                        <div id="iniciador" class="carousel-inner"></div>
                        <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide="prev">
                            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                            <span class="visually-hidden">Previous</span>
                        </button>
                        <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide="next">
                            <span class="carousel-control-next-icon" aria-hidden="true"></span>
                            <span class="visually-hidden">Next</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
        <div class="piepri">
            <h2 id="empresa"></h2>
            <p id="direc"></p>
            <div class="iconos"></div>
            <p id="derechos"></p>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.js" integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4=" crossorigin="anonymous"></script>
    <script src="./js/common.js"></script>
    <script src="./js/index.js"></script>
</body>
</html>
